<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Payment Failed</title>
<style>body{font-family:Arial,sans-serif;background:#f5f5f5;padding:20px}.container{background:#fff;max-width:600px;margin:0 auto;border-radius:8px;padding:32px}.header{background:#dc2626;color:white;padding:24px;border-radius:8px 8px 0 0;text-align:center}.footer{text-align:center;color:#6b7280;font-size:12px;margin-top:24px}</style>
</head>
<body>
<div class="container">
  <div class="header"><h1>⚠️ Payment Failed</h1></div>
  <div style="padding:24px;">
    <p>Hi <strong>{{ user.name }}</strong>,</p>
    <p>Unfortunately, your payment for order <strong>#{{ order.order_number }}</strong> could not be processed.</p>
    <p><strong>Total Amount:</strong> ${{ "%.2f"|format(order.total) }}</p>
    <p>Please try again with a different payment method or contact your bank.</p>
    <a href="#" style="display:inline-block;background:#4f46e5;color:white;padding:12px 24px;border-radius:6px;text-decoration:none;">Try Again</a>
  </div>
  <div class="footer">Smart E-Commerce Platform</div>
</div>
</body></html>
